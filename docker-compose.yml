services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: finresearch
      POSTGRES_PASSWORD: finresearch
      POSTGRES_DB: finresearch
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finresearch -d finresearch"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://finresearch:finresearch@db:5432/finresearch

  frontend:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./frontend:/app/frontend
      - ./requirements-frontend.txt:/app/requirements-frontend.txt
    command: >
      sh -c "pip install -q streamlit requests && streamlit run frontend/streamlit_app.py
             --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    environment:
      FINRESEARCH_API_URL: http://api:8000
    depends_on:
      - api

volumes:
  postgres_data:
